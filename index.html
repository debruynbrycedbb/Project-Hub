<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project hub · Bryce de Bruyn</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#04070d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="hub.enc" as="fetch" crossorigin>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body class="is-locked is-checking">
  <!-- Sign in. The hub itself is in hub.enc, encrypted, and only appears once you sign in. -->
  <main class="login" data-login-screen hidden>
    <div class="login-panel">
      <div class="brand login-brand" aria-hidden="true">
        <span class="brand-mark"><span>B</span><span class="brand-slash"></span><span class="brand-dim">D</span><span>B</span></span>
        <span class="brand-byline"><span>Project</span><span>hub</span></span>
      </div>

      <h1 class="login-title">Sign in</h1>
      <span class="hero-rule" aria-hidden="true"></span>

      <form class="login-form" data-login novalidate>
        <div class="field">
          <label for="login-user">Username</label>
          <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="login-pass">Password</label>
          <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
        </div>
        <label class="check">
          <input id="login-keep" type="checkbox" checked>
          <span>Keep me signed in on this device</span>
        </label>
        <p class="login-error" data-login-error role="alert" hidden></p>
        <button class="login-submit" type="submit" data-login-submit>
          <span class="login-submit-text">Sign in</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>
  </main>

  <noscript>
    <div class="noscript"><p>The hub needs JavaScript to sign in.</p></div>
  </noscript>

  <script src="login.js?v=3" defer></script>
</body>
</html>

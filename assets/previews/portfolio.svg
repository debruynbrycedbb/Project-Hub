<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <!-- Abstract illustration in Ledgerline's dark palette: a value chart, an allocation bar and holding rows. No real figures. -->
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ddc97" stop-opacity=".24"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bar"><rect x="96" y="518" width="1008" height="14" rx="7"/></clipPath>
  </defs>

  <rect width="1200" height="750" fill="#0b0c0e"/>

  <!-- panel -->
  <rect x="64" y="64" width="1072" height="622" rx="18" fill="#141518" stroke="#25272c"/>

  <!-- header skeleton -->
  <rect x="96" y="104" width="148" height="10" rx="5" fill="#8e929a" opacity=".55"/>
  <rect x="96" y="132" width="268" height="26" rx="8" fill="#eef0f2" opacity=".85"/>
  <rect x="384" y="138" width="86" height="16" rx="8" fill="#3ddc97" opacity=".2"/>
  <g fill="#202227">
    <rect x="852" y="106" width="56" height="28" rx="8"/>
    <rect x="916" y="106" width="56" height="28" rx="8"/>
    <rect x="980" y="106" width="56" height="28" rx="8" fill="#34373d"/>
    <rect x="1044" y="106" width="60" height="28" rx="8"/>
  </g>

  <!-- grid -->
  <g stroke="#1f2125" stroke-width="2">
    <line x1="96" y1="222" x2="1104" y2="222"/>
    <line x1="96" y1="292" x2="1104" y2="292"/>
    <line x1="96" y1="362" x2="1104" y2="362"/>
    <line x1="96" y1="432" x2="1104" y2="432"/>
  </g>

  <!-- value line -->
  <path d="M96 404 C150 398 176 380 214 384 S288 410 330 392 S402 334 452 342 S530 380 576 360 S650 298 700 304 S770 346 816 322 S892 252 944 258 S1030 230 1104 206 L1104 470 L96 470 Z" fill="url(#area)"/>
  <path d="M96 404 C150 398 176 380 214 384 S288 410 330 392 S402 334 452 342 S530 380 576 360 S650 298 700 304 S770 346 816 322 S892 252 944 258 S1030 230 1104 206" fill="none" stroke="#3ddc97" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1104" cy="206" r="9" fill="#141518" stroke="#3ddc97" stroke-width="4"/>

  <!-- allocation bar: stocks, ETFs, crypto, memecoins -->
  <g clip-path="url(#bar)">
    <rect x="96" y="518" width="440" height="14" fill="#3987e5"/>
    <rect x="536" y="518" width="276" height="14" fill="#c98500"/>
    <rect x="812" y="518" width="196" height="14" fill="#7c3aed"/>
    <rect x="1008" y="518" width="96" height="14" fill="#d55181"/>
  </g>

  <!-- holding rows -->
  <g>
    <circle cx="112" cy="586" r="12" fill="#3987e5" opacity=".9"/>
    <rect x="140" y="580" width="132" height="12" rx="6" fill="#c3c7cd" opacity=".6"/>
    <rect x="920" y="580" width="96" height="12" rx="6" fill="#c3c7cd" opacity=".45"/>
    <rect x="1032" y="578" width="72" height="16" rx="8" fill="#3ddc97" opacity=".22"/>
    <line x1="96" y1="618" x2="1104" y2="618" stroke="#25272c" stroke-width="2"/>
    <circle cx="112" cy="650" r="12" fill="#7c3aed" opacity=".9"/>
    <rect x="140" y="644" width="104" height="12" rx="6" fill="#c3c7cd" opacity=".6"/>
    <rect x="936" y="644" width="80" height="12" rx="6" fill="#c3c7cd" opacity=".45"/>
    <rect x="1032" y="642" width="72" height="16" rx="8" fill="#ff6b61" opacity=".2"/>
  </g>
</svg>
